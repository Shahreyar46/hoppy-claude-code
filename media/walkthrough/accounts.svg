<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/></filter>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L16 20l-2.6 1.2-3.4-7.3L5 19z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  </defs>

  <g filter="url(#shadow)"><rect x="20" y="16" width="560" height="384" rx="12" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-widget-border, #3c3c3c)"/></g>
  <circle cx="42" cy="36" r="5" fill="#ff5f57"/><circle cx="58" cy="36" r="5" fill="#febc2e"/><circle cx="74" cy="36" r="5" fill="#28c840"/>
  <text x="44" y="74" font-size="11" letter-spacing="1" font-weight="600" fill="var(--vscode-descriptionForeground, #9d9d9d)">CLAUDE ACCOUNTS</text>

  <!-- account cards -->
  <g>
    <rect x="40" y="88" width="300" height="62" rx="9" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-focusBorder, #007fd4)"/>
    <rect x="40" y="88" width="4" height="62" rx="2" fill="var(--vscode-focusBorder, #007fd4)"/>
    <circle cx="74" cy="119" r="16" fill="#d18616"/><text x="74" y="124" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">W</text>
    <text x="100" y="114" font-size="14" font-weight="600" fill="var(--vscode-foreground, #cccccc)">Work (Max)</text>
    <text x="100" y="133" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">you@company.com</text>
    <rect x="268" y="106" width="58" height="20" rx="10" fill="none" stroke="#3794ff"/><text x="297" y="120" font-size="11" text-anchor="middle" fill="#3794ff">in use</text>
  </g>
  <g>
    <rect x="40" y="160" width="300" height="62" rx="9" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
    <circle cx="74" cy="191" r="16" fill="#d18616"/><text x="74" y="196" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">P</text>
    <text x="100" y="186" font-size="14" font-weight="600" fill="var(--vscode-foreground, #cccccc)">Personal</text>
    <text x="100" y="205" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">me@gmail.com</text>
    <rect x="252" y="178" width="74" height="20" rx="10" fill="none" stroke="#3fb950"/>
    <use href="#check" x="259" y="182" width="12" height="12" color="#3fb950"/><text x="275" y="192" font-size="11" fill="#3fb950">logged in</text>
  </g>
  <!-- add account button -->
  <rect x="40" y="234" width="300" height="44" rx="9" fill="none" stroke="var(--vscode-focusBorder, #007fd4)" stroke-dasharray="6 5" stroke-width="1.5"/>
  <use href="#plus" x="122" y="248" width="16" height="16" color="var(--vscode-focusBorder, #3794ff)"/>
  <text x="144" y="261" font-size="14" font-weight="600" fill="var(--vscode-focusBorder, #3794ff)">Add Claude account</text>
  <use href="#cursor" x="306" y="258" width="22" height="22"/>

  <!-- arrow to login -->
  <use href="#arrow" x="352" y="246" width="28" height="28" color="var(--vscode-descriptionForeground, #9d9d9d)"/>

  <!-- new Claude tab with login -->
  <g filter="url(#soft)"><rect x="392" y="96" width="168" height="250" rx="10" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/></g>
  <rect x="392" y="96" width="168" height="30" rx="10" fill="var(--vscode-editor-background, #1e1e1e)"/>
  <rect x="392" y="116" width="168" height="10" fill="var(--vscode-editor-background, #1e1e1e)"/>
  <text x="406" y="116" font-size="11.5" fill="var(--vscode-descriptionForeground, #9d9d9d)">New Claude tab</text>
  <circle cx="476" cy="176" r="24" fill="#d97757" opacity="0.18"/>
  <path d="M476 160 C478 170 482 174 492 176 C482 178 478 182 476 192 C474 182 470 178 460 176 C470 174 474 170 476 160Z" fill="#d97757"/>
  <text x="476" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="var(--vscode-foreground, #cccccc)">Log in to Claude</text>
  <text x="476" y="245" font-size="11.5" text-anchor="middle" fill="var(--vscode-descriptionForeground, #9d9d9d)">for account “Home”</text>
  <rect x="414" y="266" width="124" height="34" rx="6" fill="var(--vscode-button-background, #0e639c)"/>
  <text x="476" y="288" font-size="13" font-weight="600" text-anchor="middle" fill="var(--vscode-button-foreground, #ffffff)">Log in</text>

  <!-- badges -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="40" cy="256" r="13" fill="#f59e0b" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3"/><text x="40" y="260.5" fill="#1a1a1a">1</text>
    <circle cx="414" cy="283" r="13" fill="#f59e0b" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3"/><text x="414" y="287.5" fill="#1a1a1a">2</text>
  </g>
  <g font-size="12.5" font-weight="700" fill="#d97706">
    <text x="44" y="310">Add an account and give it a name</text>
    <text x="404" y="370">Log in with that account</text>
  </g>
</svg>
