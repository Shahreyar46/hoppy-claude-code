<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <symbol id="sparkle" viewBox="-10 -10 20 20"><path d="M0-9C1-3 3-1 9 0 3 1 1 3 0 9-1 3-3 1-9 0-3-1-1-3 0-9Z" fill="currentColor"/></symbol>
    <symbol id="globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g></symbol>
    <symbol id="history" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></g></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></g></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L16 20l-2.6 1.2-3.4-7.3L5 19z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  </defs>

  <!-- VS Code window -->
  <g filter="url(#shadow)">
    <rect x="20" y="16" width="560" height="384" rx="12" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-widget-border, #3c3c3c)"/>
  </g>
  <circle cx="42" cy="36" r="5" fill="#ff5f57"/><circle cx="58" cy="36" r="5" fill="#febc2e"/><circle cx="74" cy="36" r="5" fill="#28c840"/>
  <!-- faint code lines -->
  <g fill="var(--vscode-editorLineNumber-foreground, #5a5a5a)" opacity="0.35">
    <rect x="44" y="290" width="160" height="7" rx="3.5"/><rect x="44" y="306" width="230" height="7" rx="3.5"/>
    <rect x="60" y="322" width="190" height="7" rx="3.5"/><rect x="60" y="338" width="120" height="7" rx="3.5"/>
  </g>

  <!-- VS Code pick list: always opens at the top centre -->
  <g filter="url(#soft)">
    <rect x="120" y="50" width="360" height="226" rx="8" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
  </g>
  <text x="300" y="70" font-size="11.5" text-anchor="middle" font-weight="600" fill="var(--vscode-foreground, #cccccc)">Hoppy</text>
  <rect x="132" y="78" width="336" height="24" rx="4" fill="var(--vscode-input-background, #313131)" stroke="var(--vscode-focusBorder, #007fd4)"/>
  <text x="142" y="94" font-size="11" fill="var(--vscode-descriptionForeground, #9d9d9d)">Switch the Claude panel, or pick an action</text>

  <!-- row: current account -->
  <use href="#sparkle" x="138" y="112" width="12" height="12" color="var(--vscode-foreground, #cccccc)"/>
  <text x="156" y="122" font-size="12.5" fill="var(--vscode-foreground, #cccccc)">Claude · Work</text>
  <use href="#check" x="246" y="112" width="11" height="11" color="#3fb950"/>
  <text x="260" y="122" font-size="11" fill="#3fb950">in use</text>

  <!-- row: hovered account -->
  <rect x="126" y="130" width="348" height="24" rx="4" fill="var(--vscode-list-activeSelectionBackground, #04395e)"/>
  <use href="#sparkle" x="138" y="136" width="12" height="12" color="var(--vscode-list-activeSelectionForeground, #ffffff)"/>
  <text x="156" y="147" font-size="12.5" font-weight="600" fill="var(--vscode-list-activeSelectionForeground, #ffffff)">Claude · Personal</text>
  <text x="282" y="147" font-size="11" fill="var(--vscode-list-activeSelectionForeground, #ffffff)" opacity="0.75">me@gmail.com</text>

  <use href="#globe" x="137" y="160" width="14" height="14" color="var(--vscode-foreground, #cccccc)"/>
  <text x="156" y="172" font-size="12.5" fill="var(--vscode-foreground, #cccccc)">Other AI</text>
  <text x="212" y="172" font-size="11" fill="var(--vscode-descriptionForeground, #9d9d9d)">models from your API keys</text>

  <line x1="132" y1="184" x2="468" y2="184" stroke="var(--vscode-widget-border, #454545)"/>
  <use href="#history" x="137" y="192" width="13" height="13" color="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="156" y="203" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">Continue a chat on another account or model…</text>
  <use href="#plus" x="137" y="214" width="13" height="13" color="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="156" y="225" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">Add Claude account</text>
  <use href="#gear" x="137" y="236" width="13" height="13" color="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="156" y="247" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">Settings</text>
  <text x="156" y="267" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">More…</text>

  <!-- cursor on Personal -->
  <use href="#cursor" x="420" y="140" width="20" height="20"/>

  <!-- status bar -->
  <path d="M20 370h560v18a12 12 0 0 1-12 12H32a12 12 0 0 1-12-12z" fill="var(--vscode-statusBar-background, #007acc)"/>
  <rect x="432" y="373" width="140" height="22" rx="4" fill="#ffffff" fill-opacity="0.22"/>
  <use href="#sparkle" x="441" y="378" width="12" height="12" color="var(--vscode-statusBar-foreground, #ffffff)"/>
  <text x="459" y="389" font-size="12.5" font-weight="600" fill="var(--vscode-statusBar-foreground, #ffffff)">Claude · Work</text>

  <!-- flow: status bar opens the list at the top -->
  <path d="M502 366 C 540 300, 540 200, 488 160" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>
  <path d="M496 156 l-9 4 4 9" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="512" y="318" font-size="11.5" font-weight="700" fill="#d97706" text-anchor="end">opens</text>
  <text x="512" y="333" font-size="11.5" font-weight="700" fill="#d97706" text-anchor="end">at the top</text>

  <!-- step badges + labels -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="414" cy="384" r="13" fill="#f59e0b" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3"/>
    <text x="414" y="388.5" fill="#1a1a1a">1</text>
    <circle cx="112" cy="142" r="13" fill="#f59e0b" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3"/>
    <text x="112" y="146.5" fill="#1a1a1a">2</text>
  </g>
  <g font-size="12.5" font-weight="700" fill="#d97706">
    <text x="398" y="358" text-anchor="end">Click it in the status bar</text>
    <text x="40" y="172">Pick an</text>
    <text x="40" y="188">account</text>
  </g>
</svg>
