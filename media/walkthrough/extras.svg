<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor"/></symbol>
    <symbol id="image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></g></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs>

  <g filter="url(#shadow)"><rect x="20" y="16" width="560" height="384" rx="12" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-widget-border, #3c3c3c)"/></g>
  <circle cx="42" cy="36" r="5" fill="#ff5f57"/><circle cx="58" cy="36" r="5" fill="#febc2e"/><circle cx="74" cy="36" r="5" fill="#28c840"/>

  <!-- left: backups -->
  <text x="44" y="72" font-size="11" letter-spacing="1" font-weight="600" fill="var(--vscode-descriptionForeground, #9d9d9d)">BACKUPS · TRIED TOP TO BOTTOM</text>
  <path d="M66 104 V 300" stroke="var(--vscode-widget-border, #454545)" stroke-width="2" stroke-dasharray="4 5"/>
  <g font-size="13">
    <rect x="44" y="86" width="250" height="40" rx="8" fill="var(--vscode-focusBorder, #007fd4)" fill-opacity="0.12" stroke="var(--vscode-focusBorder, #007fd4)" stroke-opacity="0.5"/>
    <circle cx="66" cy="106" r="12" fill="var(--vscode-focusBorder, #007fd4)"/><use href="#play" x="59" y="99" width="14" height="14" color="#fff"/>
    <text x="88" y="111" font-weight="600" fill="var(--vscode-foreground, #cccccc)">The model you picked</text>

    <rect x="44" y="140" width="250" height="40" rx="8" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
    <circle cx="66" cy="160" r="12" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-focusBorder, #007fd4)" stroke-width="2"/>
    <text x="66" y="164.5" font-size="12" font-weight="700" text-anchor="middle" fill="var(--vscode-focusBorder, #3794ff)">1</text>
    <text x="88" y="165" fill="var(--vscode-foreground, #cccccc)">Nemotron Super VL</text>
    <use href="#image" x="266" y="152" width="16" height="16" color="#3794ff"/>

    <rect x="44" y="194" width="250" height="40" rx="8" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
    <circle cx="66" cy="214" r="12" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-focusBorder, #007fd4)" stroke-width="2"/>
    <text x="66" y="218.5" font-size="12" font-weight="700" text-anchor="middle" fill="var(--vscode-focusBorder, #3794ff)">2</text>
    <text x="88" y="219" fill="var(--vscode-foreground, #cccccc)">Laguna S</text>

    <rect x="44" y="248" width="250" height="40" rx="8" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
    <circle cx="66" cy="268" r="12" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-focusBorder, #007fd4)" stroke-width="2"/>
    <text x="66" y="272.5" font-size="12" font-weight="700" text-anchor="middle" fill="var(--vscode-focusBorder, #3794ff)">3</text>
    <text x="88" y="273" fill="var(--vscode-foreground, #cccccc)">Gemini Flash</text>
    <use href="#image" x="266" y="260" width="16" height="16" color="#3794ff"/>
  </g>
  <text x="44" y="314" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">Busy or out of free requests? The next one takes over.</text>

  <!-- right: second opinion -->
  <text x="320" y="72" font-size="11" letter-spacing="1" font-weight="600" fill="var(--vscode-descriptionForeground, #9d9d9d)">ASK ANOTHER AI FROM A CLAUDE CHAT</text>
  <rect x="320" y="86" width="236" height="210" rx="10" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
  <rect x="380" y="102" width="162" height="40" rx="12" fill="var(--vscode-button-background, #0e639c)"/>
  <text x="392" y="119" font-size="12" fill="var(--vscode-button-foreground, #fff)">ask nemotron to</text>
  <text x="392" y="134" font-size="12" fill="var(--vscode-button-foreground, #fff)">review this fix</text>
  <circle cx="346" cy="172" r="12" fill="#d97757" fill-opacity="0.18"/>
  <path d="M346 163 C347 168 349 170 355 172 C349 174 347 176 346 181 C345 176 343 174 337 172 C343 170 345 168 346 163Z" fill="#d97757"/>
  <rect x="364" y="156" width="178" height="124" rx="10" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-widget-border, #454545)"/>
  <text x="376" y="178" font-size="12" font-weight="600" fill="var(--vscode-foreground, #cccccc)">Nemotron agrees on 2 points</text>
  <text x="376" y="198" font-size="12" fill="#3fb950">✓ null check is right</text>
  <text x="376" y="216" font-size="12" fill="#3fb950">✓ tests cover it</text>
  <text x="376" y="234" font-size="12" fill="#d97706">! it spotted a missed</text>
  <text x="388" y="250" font-size="12" fill="#d97706">edge case</text>
  <text x="376" y="270" font-size="11" fill="var(--vscode-descriptionForeground, #9d9d9d)">Claude compares both answers</text>

  <text x="44" y="356" font-size="13" font-weight="600" fill="var(--vscode-foreground, #cccccc)">All optional. The defaults work fine.</text>
  <text x="44" y="377" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">Change models and backups in Settings. Install /second-opinion with one click.</text>
</svg>
