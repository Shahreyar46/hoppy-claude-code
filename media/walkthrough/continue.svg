<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <symbol id="warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 17v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs>

  <g filter="url(#shadow)"><rect x="20" y="16" width="560" height="384" rx="12" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-widget-border, #3c3c3c)"/></g>
  <circle cx="42" cy="36" r="5" fill="#ff5f57"/><circle cx="58" cy="36" r="5" fill="#febc2e"/><circle cx="74" cy="36" r="5" fill="#28c840"/>

  <!-- left: chat that hit the limit -->
  <rect x="40" y="60" width="236" height="290" rx="10" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
  <circle cx="62" cy="82" r="10" fill="#d18616"/><text x="62" y="86" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">W</text>
  <text x="80" y="87" font-size="13" font-weight="600" fill="var(--vscode-foreground, #cccccc)">Claude · Work</text>
  <g fill="var(--vscode-editorLineNumber-foreground, #6e7681)" opacity="0.5">
    <rect x="56" y="108" width="180" height="8" rx="4"/><rect x="56" y="124" width="140" height="8" rx="4"/>
    <rect x="96" y="148" width="164" height="8" rx="4"/><rect x="120" y="164" width="140" height="8" rx="4"/>
    <rect x="56" y="188" width="196" height="8" rx="4"/><rect x="56" y="204" width="120" height="8" rx="4"/>
  </g>
  <rect x="54" y="232" width="208" height="54" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.6"/>
  <use href="#warn" x="64" y="242" width="18" height="18" color="#d97706"/>
  <text x="90" y="256" font-size="12.5" font-weight="700" fill="#d97706">Usage limit reached</text>
  <text x="90" y="274" font-size="11.5" fill="var(--vscode-descriptionForeground, #9d9d9d)">Resets in a few hours</text>

  <!-- middle: action -->
  <path d="M286 205 H 320" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
  <path d="M316 197 l9 8 -9 8" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="304" y="186" font-size="11.5" font-weight="700" text-anchor="middle" fill="#d97706">Continue</text>
  <text x="304" y="232" font-size="11.5" font-weight="700" text-anchor="middle" fill="#d97706">a chat</text>

  <!-- right: new tab on Other AI with /resume -->
  <rect x="336" y="60" width="224" height="290" rx="10" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-focusBorder, #007fd4)"/>
  <circle cx="358" cy="82" r="10" fill="#3794ff"/><use href="#globe" x="351" y="75" width="14" height="14" color="#fff"/>
  <text x="376" y="87" font-size="13" font-weight="600" fill="var(--vscode-foreground, #cccccc)">Other AI · new tab</text>
  <text x="352" y="118" font-size="11" letter-spacing="1" font-weight="600" fill="var(--vscode-descriptionForeground, #9d9d9d)">RESUME A CHAT</text>
  <rect x="348" y="128" width="200" height="44" rx="7" fill="var(--vscode-list-activeSelectionBackground, #04395e)"/>
  <use href="#chat" x="358" y="141" width="18" height="18" color="var(--vscode-list-activeSelectionForeground, #fff)"/>
  <text x="384" y="147" font-size="12.5" font-weight="600" fill="var(--vscode-list-activeSelectionForeground, #fff)">Fix the login bug</text>
  <text x="384" y="163" font-size="11" fill="var(--vscode-list-activeSelectionForeground, #fff)" opacity="0.75">from Claude · Work</text>
  <rect x="348" y="180" width="200" height="38" rx="7" fill="none" stroke="var(--vscode-widget-border, #454545)"/>
  <use href="#chat" x="358" y="190" width="18" height="18" color="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="384" y="204" font-size="12.5" fill="var(--vscode-descriptionForeground, #9d9d9d)">Add dark mode</text>
  <!-- input with /resume -->
  <rect x="348" y="300" width="200" height="36" rx="7" fill="var(--vscode-input-background, #313131)" stroke="var(--vscode-focusBorder, #007fd4)"/>
  <text x="362" y="323" font-size="14" font-weight="600" fill="var(--vscode-foreground, #cccccc)" font-family="Consolas, monospace">/resume</text>
  <rect x="428" y="310" width="2" height="17" fill="var(--vscode-foreground, #cccccc)"/>

  <!-- badges -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="304" cy="205" r="13" fill="#f59e0b" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3"/><text x="304" y="209.5" fill="#1a1a1a">1</text>
    <circle cx="560" cy="318" r="13" fill="#f59e0b" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3"/><text x="560" y="322.5" fill="#1a1a1a">2</text>
    <circle cx="560" cy="150" r="13" fill="#f59e0b" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3"/><text x="560" y="154.5" fill="#1a1a1a">3</text>
  </g>
  <text x="40" y="378" font-size="12.5" fill="var(--vscode-descriptionForeground, #9d9d9d)">Messages, code changes and results all come with the chat.</text>
</svg>
