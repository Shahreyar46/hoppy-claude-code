<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
    <symbol id="warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 17v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>

  <!-- window -->
  <g filter="url(#shadow)"><rect x="20" y="16" width="560" height="384" rx="10" fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-widget-border, #3c3c3c)"/></g>

  <!-- 1: the chat hits the limit -->
  <circle cx="52" cy="50" r="13" fill="var(--vscode-button-background, #0e639c)"/>
  <text x="52" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="var(--vscode-button-foreground, #fff)">1</text>
  <text x="74" y="55" font-size="15" font-weight="600" fill="var(--vscode-foreground, #ccc)">Claude stops: the account hit its limit</text>
  <rect x="40" y="72" width="520" height="54" rx="6" fill="var(--vscode-inputValidation-warningBackground, #352a05)" stroke="var(--vscode-editorWarning-foreground, #cca700)" stroke-opacity="0.6"/>
  <use href="#warn" x="54" y="87" width="22" height="22" style="color: var(--vscode-editorWarning-foreground, #cca700)"/>
  <text x="86" y="104" font-size="14" fill="var(--vscode-foreground, #ccc)">You've hit your session limit · resets 12:50am</text>

  <!-- 2: Hoppy asks -->
  <circle cx="52" cy="160" r="13" fill="var(--vscode-button-background, #0e639c)"/>
  <text x="52" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="var(--vscode-button-foreground, #fff)">2</text>
  <text x="74" y="165" font-size="15" font-weight="600" fill="var(--vscode-foreground, #ccc)">Hoppy asks where to keep going</text>
  <rect x="40" y="180" width="520" height="94" rx="6" fill="var(--vscode-notifications-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
  <text x="58" y="208" font-size="13.5" fill="var(--vscode-foreground, #ccc)">Claude · Work hit its session limit. Keep this chat going?</text>
  <rect x="58" y="226" width="176" height="32" rx="3" fill="var(--vscode-button-background, #0e639c)"/>
  <text x="146" y="247" text-anchor="middle" font-size="13" font-weight="600" fill="var(--vscode-button-foreground, #fff)">Continue on Personal</text>
  <rect x="244" y="226" width="166" height="32" rx="3" fill="var(--vscode-button-secondaryBackground, #3a3d41)"/>
  <text x="327" y="247" text-anchor="middle" font-size="13" fill="var(--vscode-button-secondaryForeground, #fff)">Continue on Other AI</text>
  <rect x="420" y="226" width="80" height="32" rx="3" fill="var(--vscode-button-secondaryBackground, #3a3d41)"/>
  <text x="460" y="247" text-anchor="middle" font-size="13" fill="var(--vscode-button-secondaryForeground, #fff)">Choose…</text>

  <!-- 3: same chat continues -->
  <circle cx="52" cy="308" r="13" fill="var(--vscode-button-background, #0e639c)"/>
  <text x="52" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="var(--vscode-button-foreground, #fff)">3</text>
  <text x="74" y="313" font-size="15" font-weight="600" fill="var(--vscode-foreground, #ccc)">The same chat opens in a new tab</text>
  <rect x="40" y="328" width="520" height="52" rx="6" fill="var(--vscode-quickInput-background, #252526)" stroke="var(--vscode-widget-border, #454545)"/>
  <text x="58" y="359" font-size="13.5" fill="var(--vscode-descriptionForeground, #9d9d9d)">Add dark mode to settings…</text>
  <use href="#arrow" x="300" y="342" width="22" height="22" style="color: var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="332" y="359" font-size="13.5" font-weight="600" fill="var(--vscode-testing-iconPassed, #3fb950)">Send a message and carry on</text>
</svg>
