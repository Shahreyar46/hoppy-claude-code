<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Publisher mark for Shahreyar Shimul: "SS" monogram, dark tile with the peach-coral accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2433"/>
      <stop offset="1" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="1" stop-color="#FF6B8B"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="54" fill="none" stroke="url(#acc)" stroke-width="3" opacity=".55"/>
  <text x="128" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-6" fill="#F3F1EC">S<tspan fill="url(#acc)">S</tspan></text>
  <rect x="78" y="186" width="100" height="8" rx="4" fill="url(#acc)"/>
</svg>
